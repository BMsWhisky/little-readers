<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book 4X Ants at the Camp</title><style>body{font:18px -apple-system,sans-serif;background:#edf5ef;color:#17432d;margin:0}main{max-width:750px;margin:auto;padding:20px}section{background:white;padding:18px;border-radius:16px;margin:12px 0}button{font:inherit;padding:12px;border:1px solid #9ac4aa;border-radius:12px;background:white;margin:4px}button.active,.primary{background:#177c54;color:white}a{color:#14794d}small{color:#667e6e}</style><main><h1>📗 Fitzroy Readers 4X</h1><h2>Ants at the Camp</h2><p><a href="./">首頁</a> · <a href="games.html">2X/3X 遊戲</a></p><section><h3>本冊教學重點</h3><p>短母音 o（dot）｜字母 a 的兩種印刷字形｜較長單字：seven、swim、pond、frog、cold</p><button class="primary" onclick="say('frog')">🔊 測試發音</button></section><section><h3>逐頁教學（P2–11）</h3><div id="nav"></div><div id="lesson"></div></section><section><h3>🎮 全冊小遊戲</h3><button onclick="mode='listen';next()">聽音選字</button><button onclick="mode='spell';next()">拼字挑戰</button><button onclick="mode='quiz';next()">故事問答</button><button onclick="mode='record';next()">錄音跟讀</button><div id="game"></div><p id="feedback"></p></section><section><h3>課後紀錄</h3><select id="kid"><option>Louis</option><option>Ken</option></select><select id="level"><option>需要協助</option><option>練習中</option><option>已掌握</option></select><button onclick="save()">儲存這頁</button><p id="saved"></p><small>紀錄只保存在本機。錄音不會自動評分，也不會上傳。</small></section></main><script>
const pages=[[2,"Lin at camp",["Lin","camp","seven"],"Where is Lin?","At the camp."],[3,"Max at camp",["Max","camp","six"],"Where is Max?","At the camp."],[4,"Swimming",["swim","pond","cold"],"Where do they swim?","In the pond."],[5,"On the rug",["rug","sit","pond"],"Where do they sit?","On a rug."],[6,"Food",["egg","bun","ham"],"What food can you see?","Egg, bun and ham."],[7,"Ants",["six","ants","bun"],"What is on the bun?","Ants."],[8,"Ants off",["ants","off","bun"],"Who removes the ants?","Lin."],[9,"Gum nuts",["ten","gum","nuts"],"How many gum nuts?","Ten."],[10,"Frog",["frog","pond","Lin"],"What animal is there?","A frog."],[11,"Frog hops",["frog","hops","nuts"],"What does the frog hop on?","Gum nuts."]],vocab=[...new Set(pages.flatMap(p=>p[2]).concat(['dot','not','back','tack','fold','eggs','seven','swim','pond','frog','cold']))];let p=0,mode='listen',i=0,typed='',rec,stream;const $=id=>document.getElementById(id);function say(t){if(!('speechSynthesis'in window))return alert('請使用 Safari');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}
function render(){const n=$('nav');n.replaceChildren();pages.forEach((x,j)=>{let b=document.createElement('button');b.textContent='P'+x[0];b.className=p===j?'active':'';b.onclick=()=>{p=j;render()};n.append(b)});const x=pages[p],d=$('lesson');d.replaceChildren();const h=document.createElement('h3');h.textContent='P'+x[0]+'｜'+x[1];d.append(h);const intro=document.createElement('p');intro.textContent='請翻開紙本第 '+x[0]+' 頁：先看圖、指字朗讀，再做問答。';d.append(intro);x[2].forEach(w=>{let b=document.createElement('button');b.textContent='🔊 '+w;b.onclick=()=>say(w);d.append(b)});const q=document.createElement('p');q.textContent='家長提問：'+x[3];d.append(q);let b=document.createElement('button');b.textContent='🔊 播放問題';b.onclick=()=>say(x[3]);d.append(b);let details=document.createElement('details');details.innerHTML='<summary>參考答案</summary>';details.append(document.createTextNode(x[4]));d.append(details)}
function shuffle(a){return a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1])}function next(){i++;typed='';game()}function game(){const d=$('game');d.replaceChildren();const w=vocab[i%vocab.length],x=pages[i%pages.length];function btn(t,fn){let b=document.createElement('button');b.textContent=t;b.onclick=fn;d.append(b);return b}function mark(ok){$('feedback').textContent=ok?'⭐ 答對！':'再試一次';if(ok)setTimeout(next,700)}
if(mode==='listen'){btn('🔊 播放單字',()=>say(w));shuffle([w,...shuffle(vocab.filter(z=>z!==w)).slice(0,2)]).forEach(z=>btn(z,()=>mark(z===w)))}
if(mode==='spell'){btn('🔊 播放單字',()=>say(w));const output=document.createElement('h2');output.textContent='_';d.append(output);shuffle(w.toLowerCase().split('')).forEach(z=>{let b=btn(z.toUpperCase(),()=>{typed+=z;output.textContent=typed.toUpperCase();b.disabled=true;if(typed.length===w.length){const ok=typed===w.toLowerCase();typed='';mark(ok);if(!ok)setTimeout(game,700)}})})}
if(mode==='quiz'){const q=document.createElement('h3');q.textContent=x[3];d.append(q);btn('🔊 聽問題',()=>say(x[3]));shuffle([x[4],...shuffle(pages.filter(y=>y[4]!==x[4]).map(y=>y[4])).slice(0,2)]).forEach(z=>btn(z,()=>mark(z===x[4])))}
if(mode==='record'){const h=document.createElement('h2');h.textContent=w;d.append(h);btn('🔊 聽發音',()=>say(w));const result=document.createElement('div');btn('🎙️ 錄音',async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{const a=document.createElement('audio');a.controls=true;a.src=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType}));result.replaceChildren(a);stream.getTracks().forEach(t=>t.stop())};rec.start();result.textContent='錄音中…'}catch(e){result.textContent='請使用 Safari 並允許麥克風'}});btn('⏹️ 停止',()=>{if(rec?.state==='recording')rec.stop()});btn('下一個',next);d.append(result)}}
function save(){const key='lr4-'+$('kid').value+'-'+pages[p][0];localStorage.setItem(key,$('level').value);$('saved').textContent='已儲存 '+key}render();game();
</script></html>
