<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Readers 2X–4X</title><style>body{margin:0;background:#eef7ef;color:#1b432e;font:17px -apple-system,"Noto Sans TC",sans-serif}main{max-width:760px;margin:auto;padding:16px}section{background:white;padding:18px;border-radius:17px;margin:14px 0}button,textarea{font:inherit;padding:12px;border:1px solid #a9cbb5;border-radius:12px;background:white;color:#174b32;margin:4px}button.active,button.primary{background:#147b50;color:white}h1{font-size:26px}.bar{display:flex;flex-wrap:wrap;gap:5px}.bar button{flex:1;min-width:95px}.line{border-bottom:1px solid #e2ebe4;padding:15px 0}.en{font-size:24px;font-weight:650}.zh{color:#587363;margin:8px 0}.warn{background:#fff4d8;padding:12px;border-radius:10px}textarea{width:92%;min-height:90px}.muted{color:#657f6d}</style><main><section style="background:#e7f2e9;border:2px solid #91bca1"><h2>📗 Book 4X｜Ants at the Camp</h2><p>全冊逐頁家長教案、自然發音與專屬遊戲</p><a href="book4.html" style="display:inline-block;padding:12px;background:#147b54;color:white;border-radius:10px">開啟 Book 4X →</a></section><section style="background:#e4f3e8;border:2px solid #9cc9aa"><h2>📖 完整逐頁教材</h2><p>Book 2X 與 3X 全部故事頁面 P2–11，含家長指引、單字發音、問答與進度。</p><a href="pages.html" style="display:inline-block;padding:12px;background:#147c55;color:white;border-radius:10px">開始逐頁教學 →</a></section><h1>📚 Little Readers</h1><p>2X · 3X · 4X｜逐頁朗讀、中文翻譯、單字、自然發音</p><section><div class="bar" id="books"></div><h2 id="title"></h2><div class="bar" id="tabs"></div></section><section id="body"></section><p id="status" role="status"></p><small class="muted">英文語音使用瀏覽器內建朗讀。建議 iPhone 使用 Safari；請搭配正版紙本書。</small></main><script>
const books={"2X":{"title":"Tom Cat and Jim Rat","sound":"a / i","words":"cat:貓,rat:老鼠,Tom:湯姆,Jim:吉姆,Dad:爸爸,Kim:金,lap:大腿,bag:袋子,sip:小口喝,nip:輕咬,nap:小睡,tap:輕拍","pages":{"2":"Tom Cat is on Dad's lap.","4":"Jim Rat is on Kim's lap.","6":"Dad taps Tom Cat."},"phonics":"cat,bag,lap,Jim,sip,nip"},"3X":{"title":"The Mud Hut","sound":"u","words":"mud:泥巴,hut:小屋,bug:小蟲,tug:拉,rug:地毯,sun:太陽,dig:挖,can:能夠,Mum:媽媽,Dad:爸爸,Meg:梅格,Sam:山姆,lift:抬起,dump:倒出,snug:舒適","pages":{"2":"Mum and Dad dig in the mud.","4":"Meg and Sam can dig a lot of mud.","8":"Is it a mud hut yet?","10":"It is a snug mud hut!"},"phonics":"mud,hut,bug,sun,rug,tug"},"4X":{"title":"Ants at the Camp","sound":"o","words":"Lin:琳,Max:麥克斯,camp:營地,seven:七,six:六,swim:游泳,pond:池塘,cold:冷的,rug:地墊,sit:坐,egg:蛋,bun:麵包,ham:火腿,ants:螞蟻,ten:十,gum nuts:桉樹果實,frog:青蛙,hot:熱的,back:回去","pages":{"2":"Lin is at the camp.|Lin is seven.","3":"Max is at the camp.|Max is six.","4":"Max and Lin swim in the pond.|It is cold.","5":"A rug.|Lin and Max sit on the rug at the pond.","6":"Lin has egg on a bun.|Max has ham on a bun.","7":"But six big ants get on Max's bun.","8":"Lin gets the ants off Max's bun.","9":"Max gets ten gum nuts.","10":"Lin gets a frog from the pond.","11":"The frog hops on the gum nuts.","12":"The frog gets hot.","13":"Lin lets the frog get back in the cold pond."},"phonics":"dot,hot,frog,pond,log"}},translations={"Lin is at the camp.":"Lin 在營地。","Lin is seven.":"Lin 七歲。","Max is at the camp.":"Max 在營地。","Max is six.":"Max 六歲。","Max and Lin swim in the pond.":"Max 和 Lin 在池塘游泳。","It is cold.":"水很冷。","A rug.":"一張地墊。","Lin and Max sit on the rug at the pond.":"Lin 和 Max 坐在池塘邊的地墊上。","Lin has egg on a bun.":"Lin 的麵包上有蛋。","Max has ham on a bun.":"Max 的麵包上有火腿。","But six big ants get on Max's bun.":"但是六隻大螞蟻爬上 Max 的麵包。","Lin gets the ants off Max's bun.":"Lin 把螞蟻從 Max 的麵包上弄走。","Max gets ten gum nuts.":"Max 拿到十顆桉樹果實。","Lin gets a frog from the pond.":"Lin 從池塘抓到一隻青蛙。","The frog hops on the gum nuts.":"青蛙跳到桉樹果實上。","The frog gets hot.":"青蛙覺得熱了。","Lin lets the frog get back in the cold pond.":"Lin 讓青蛙回到冰涼的池塘。","Tom Cat is on Dad's lap.":"湯姆貓在爸爸大腿上。","Jim Rat is on Kim's lap.":"吉姆鼠在 Kim 的大腿上。","Dad taps Tom Cat.":"爸爸輕拍湯姆貓。","Mum and Dad dig in the mud.":"媽媽和爸爸在泥巴裡挖。","Meg and Sam can dig a lot of mud.":"Meg 和 Sam 能挖很多泥巴。","Is it a mud hut yet?":"它已經是泥巴小屋了嗎？","It is a snug mud hut!":"這是一間舒適的泥巴小屋！"};let book=new URLSearchParams(location.search).get('book')||'2X',tab='pages',page=2;if(!books[book])book='2X';const $=id=>document.getElementById(id);
function E(t,s){let x=document.createElement(t);if(s!==undefined)x.textContent=s;return x}function B(s,f,a){let x=E('button',s);x.onclick=f;if(a)x.className='active';return x}
function say(s,slow=false){if(!window.speechSynthesis){$('status').textContent='此瀏覽器不支援語音';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=slow?.65:.85;let v=speechSynthesis.getVoices();u.voice=v.find(x=>x.lang==='en-US')||v.find(x=>x.lang.startsWith('en'))||null;u.onerror=()=>$('status').textContent='播放失敗，請檢查音量與 Safari 設定';speechSynthesis.speak(u)}
function line(en,zh,where){let d=E('div');d.className='line';let a=E('div',en),c=E('div',zh);a.className='en';c.className='zh';d.append(a,c,B('🔊 英文',()=>say(en)),B('🐢 慢速',()=>say(en,true)));where.append(d)}
function setBook(k){book=k;page=2;history.replaceState(null,'','?book='+k);render()}function setTab(t){tab=t;render()}
function render(){let x=books[book],c=$('body');$('books').replaceChildren();Object.keys(books).forEach(k=>$('books').append(B(k,()=>setBook(k),k===book)));$('title').textContent=book+'｜'+x.title;$('tabs').replaceChildren();[['pages','📖 逐頁朗讀'],['words','🔤 單字'],['phonics','🗣️ 自然發音']].forEach(([k,t])=>$('tabs').append(B(t,()=>setTab(k),k===tab)));c.replaceChildren();
if(tab==='pages'){c.append(E('h2','第 '+page+' 頁'));let nav=E('div');nav.className='bar';for(let p=2;p<=13;p++)nav.append(B('P'+p,()=>{page=p;render()},page===p));c.append(nav);if(book!=='4X')c.append(E('p','⚠️ 2X、3X 尚缺完整原書頁面，現有句子為已知練習內容，頁碼尚待核對。'));let text=x.pages[page]||'',extra=localStorage.getItem('lr-new-'+book+'-'+page)||'';if(text)text.split('|').forEach(s=>line(s,translations[s]||'翻譯待補',c));if(extra)extra.split('\n').filter(Boolean).forEach(s=>line(s,'家長補充內容',c));if(!text&&!extra)c.append(E('p','此頁原文尚待補齊。'));if(text||extra)c.append(B('▶️ 朗讀整頁',()=>say([text.replaceAll('|',' '),extra.replaceAll('\n',' ')].join(' ')),true));let details=E('details');details.append(E('summary','✏️ 補充／修正本頁英文'));let input=E('textarea');input.value=extra;input.placeholder='每句英文換一行';details.append(input,B('儲存本頁',()=>{localStorage.setItem('lr-new-'+book+'-'+page,input.value);render()}));c.append(details);c.append(B('← 上一頁',()=>{page=Math.max(2,page-1);render()}),B('下一頁 →',()=>{page=Math.min(13,page+1);render()}))}
if(tab==='words'){c.append(E('h2','本冊單字'));x.words.split(',').forEach(s=>{let j=s.indexOf(':'),en=s.slice(0,j),zh=s.slice(j+1);line(en,zh,c)})}
if(tab==='phonics'){c.append(E('h2','自然發音｜'+x.sound),E('p','使用完整單字示範母音，不將單獨字母誤唸成字母名稱。'));let map=Object.fromEntries(x.words.split(',').map(s=>s.split(':')));x.phonics.split(',').forEach(w=>line(w,map[w]||'拼讀示範',c))}
}render();
</script></html>
