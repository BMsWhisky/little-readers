<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Readers 家庭英文教案</title><style>body{font:17px -apple-system,BlinkMacSystemFont,sans-serif;background:#eef6f0;color:#173e2d;margin:0}main{max-width:700px;margin:auto;padding:18px}h1{font-size:29px}h2{font-size:22px}button,select{font:inherit;padding:13px;border:1px solid #9cbdab;border-radius:12px;background:white;color:#174632;margin:4px}button:active{background:#d5eee1}.active,.play{background:#147c55;color:white}section{background:white;border-radius:18px;padding:17px;margin:14px 0;box-shadow:0 2px 8px #183b2210}.word{display:inline-block;border:1px solid #cbded1;border-radius:14px;padding:13px;margin:5px;text-align:center;min-width:75px}.word b{display:block;font-size:25px}small{color:#54715e}li{margin:12px 0}.notice{background:#fff4d7;padding:12px;border-radius:12px}textarea{width:95%;height:65px;font:inherit;padding:8px;border:1px solid #aac}label{display:block;margin:12px 0}</style><main><p><a href="story4x.html" style="display:inline-block;padding:12px;background:#e0f3e4;border-radius:12px;color:#126e48;font-weight:bold">🐸 新增 4X｜Ants at the Camp（英文朗讀＋中文翻譯＋遊戲） →</a></p><section style="background:#e3f4e9;border:2px solid #9bc6ab"><h2>📚 完整教材學習 v2.0</h2><p>整本 Fitzroy Readers 的自然發音、單字、逐頁閱讀、理解與口說課程。</p><a href="curriculum.html" style="display:inline-block;padding:12px;background:#147c55;color:white;border-radius:10px">開啟完整教材教案 →</a>　<a href="games.html">🎮 小遊戲</a></section><h1>📖 Little Readers</h1><p>爸爸媽媽共用 · 第一週有聲家庭英文教案</p><section><button id="ken" onclick="choose('Ken')">🐯 Ken 楷泳</button><button id="louis" onclick="choose('Louis')">🦕 Louis 沐霖</button><p>選擇課程</p><div id="days"></div><button class="play" onclick="say('Hello! Let us read together.')">🔊 測試英文聲音</button><button onclick="speechSynthesis.cancel()">停止</button><p id="status" role="status"></p></section><section id="lesson"></section><section><h2>📝 家長課後紀錄</h2><label>拼讀 <select id="phon"><option>尚未評估</option><option>需要協助</option><option>部分獨立</option><option>完全獨立</option></select></label><label>理解 <select id="comp"><option>尚未評估</option><option>需要協助</option><option>部分獨立</option><option>完全獨立</option></select></label><textarea id="notes" placeholder="哪些單字還需要練習？"></textarea><p><button onclick="save()">儲存本機紀錄</button><button onclick="copyRecord()">複製紀錄給另一位家長</button></p><small>紀錄僅保存在目前裝置的瀏覽器，不會上傳到 GitHub，也不會跨裝置同步。</small></section><p><small>教材：Fitzroy Readers 2X / 3X。請搭配家中的正版紙本故事書。語音使用瀏覽器內建英文語音。</small></p></main><script>
const data={Ken:[
{title:"短母音 a / i",words:["cat","bag","sip"],page:"Book 2X P2–5",sentence:"Dad has a bag.",question:"What does Dad have?",answer:"A bag."},
{title:"聽辨 a 和 i",words:["cat","Jim","sip"],page:"Book 2X P2–5",sentence:"Jim Rat has a sip.",question:"Who has a sip?",answer:"Jim Rat."},
{title:"閱讀 P2–3",words:["cat","lap","bag"],page:"Book 2X P2–3",sentence:"Tom Cat is on Dad's lap.",question:"Where is Tom Cat?",answer:"On Dad's lap."},
{title:"閱讀 P4–5",words:["Jim","Kim","sip"],page:"Book 2X P4–5",sentence:"Jim Rat is on Kim's lap.",question:"Where is Jim Rat?",answer:"On Kim's lap."},
{title:"較長單字",words:["nip","nips","tap","taps"],page:"Book 2X P6–7",sentence:"Dad taps Tom Cat.",question:"Who taps Tom Cat?",answer:"Dad."},
{title:"故事複習",words:["cat","bag","sip","lap"],page:"Book 2X P2–5",sentence:"Jim Rat has a sip.",question:"What does Jim Rat do?",answer:"He has a sip."},
{title:"第一週小測驗",words:["cat","bag","sip","Jim","lap"],page:"Book 2X P2–5",sentence:"Dad has a bag.",question:"What does Dad have?",answer:"A bag."}
],Louis:[
{title:"短母音 u",words:["mud","hut","bug"],page:"Book 3X P2–3",sentence:"Dad can dig.",question:"Who can dig?",answer:"Dad."},
{title:"短母音 u 辨識",words:["mud","hut","tug"],page:"Book 3X P2–5",sentence:"Mum can dig.",question:"Who can dig?",answer:"Mum."},
{title:"閱讀 P2–3",words:["dig","mud","can"],page:"Book 3X P2–3",sentence:"Mum and Dad dig in the mud.",question:"What do Mum and Dad do?",answer:"They dig."},
{title:"閱讀 P4–5",words:["Meg","Sam","mud"],page:"Book 3X P4–5",sentence:"Meg and Sam can dig a lot of mud.",question:"Who can dig?",answer:"Meg and Sam."},
{title:"較長單字",words:["lift","dump","snug"],page:"Book 3X P8–11",sentence:"Sam and Meg dump the mud.",question:"What do they dump?",answer:"The mud."},
{title:"故事理解",words:["mud","hut","dig","dump"],page:"Book 3X P6–11",sentence:"Is it a mud hut yet?",question:"What are they making?",answer:"A mud hut."},
{title:"第一週小測驗",words:["mud","hut","bug","lift","dump"],page:"Book 3X P2–11",sentence:"It is a snug mud hut!",question:"What did they build?",answer:"A mud hut."}
]};
let kid="Ken",day=0;const $=id=>document.getElementById(id);let voices=[];function loadVoices(){voices=speechSynthesis.getVoices()}if('speechSynthesis'in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function say(t,slow=false){if(!('speechSynthesis'in window)){$('status').textContent='此瀏覽器不支援語音播放，請用 Safari 開啟網站';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=slow?.68:.87;let v=voices.find(x=>x.lang==='en-US')||voices.find(x=>x.lang.startsWith('en'));if(v)u.voice=v;u.onerror=()=>{$('status').textContent='播放失敗，請檢查 iPhone 音量並使用 Safari'};u.onstart=()=>{$('status').textContent='正在播放：'+t};u.onend=()=>{$('status').textContent='播放完成'};speechSynthesis.speak(u)}
function choose(k){kid=k;day=0;render()}function pick(d){day=d;render()}
function render(){['ken','louis'].forEach(x=>$(x).className=x.toLowerCase()===kid.toLowerCase()?'active':'');$('days').innerHTML=Array.from({length:7},(_,i)=>'<button class="'+(i===day?'active':'')+'" onclick="pick('+i+')">Day '+(i+1)+'</button>').join('');let l=data[kid][day];$('lesson').innerHTML='<h2>'+kid+' · Day '+(day+1)+'</h2><h3>'+l.title+'</h3><p>📚 紙本教材：'+l.page+'</p><p>① 先聽單字，再讓孩子跟讀兩次。Ken 練習逐音拼讀；Louis 練習自行讀出。</p><div>'+l.words.map(w=>'<div class="word"><b>'+w+'</b><button class="play" onclick="say(\''+w+'\')">🔊 播放</button></div>').join('')+'</div><p>② 打開紙本書，找出今天的單字，家長指著文字讓孩子讀。</p><p>③ 練習短句：</p><h3>'+l.sentence+'</h3><button class="play" onclick="say(\''+l.sentence.replaceAll("'","\\'")+'\')">🔊 句子朗讀</button><button onclick="say(\''+l.sentence.replaceAll("'","\\'")+'\',true)">🐢 慢速</button><p>④ 家長問孩子：</p><h3>'+l.question+'</h3><button onclick="say(\''+l.question.replaceAll("'","\\'")+'\')">🔊 播放問題</button><details><summary>查看參考答案（先讓孩子自己回答）</summary>'+l.answer+'</details><p class="notice">家長提示：不會唸時直接按🔊，不要強迫孩子猜。若需要幫忙，先示範，再讓孩子自己試一次。</p>';let saved=JSON.parse(localStorage.getItem('readers-'+kid+'-'+day)||'{}');$('phon').value=saved.phon||'尚未評估';$('comp').value=saved.comp||'尚未評估';$('notes').value=saved.notes||''}
function record(){return {kid,day:day+1,phon:$('phon').value,comp:$('comp').value,notes:$('notes').value}}function save(){localStorage.setItem('readers-'+kid+'-'+day,JSON.stringify(record()));alert('已儲存於這台裝置')}async function copyRecord(){let r=record(),t=r.kid+' Day '+r.day+'\n拼讀：'+r.phon+'\n理解：'+r.comp+'\n備註：'+r.notes;try{await navigator.clipboard.writeText(t);alert('已複製，可貼給另一位家長')}catch(e){prompt('請複製下列紀錄',t)}}render();
</script></html>
