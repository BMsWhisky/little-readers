<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Readers 2X–4X 雙語教學</title><style>body{font:17px -apple-system,"Noto Sans TC",sans-serif;background:#eff7ef;color:#183e2d;margin:0}main{max-width:760px;margin:auto;padding:16px}section{background:white;border-radius:17px;padding:18px;margin:14px 0}button,select,input{font:inherit;padding:11px;border:1px solid #a6c8b2;border-radius:12px;background:white;color:#174d35;margin:4px}button.active,.primary{background:#16794d;color:white}h1{font-size:26px}h2{font-size:21px}.pair{border-bottom:1px solid #e0e9e0;padding:12px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.en{font-size:21px;font-weight:bold}.zh,.muted{color:#5b7866}.zh{flex:1;min-width:110px}.tabs{display:flex;flex-wrap:wrap}.tabs button{flex:1;min-width:120px}.choices button{min-width:90px}details{padding:12px 0;border-bottom:1px solid #e0e9e0}summary{font-weight:bold;cursor:pointer}label{display:block;margin:12px 0}audio{max-width:100%}</style><main><h1>📚 Little Readers</h1><p>2X–4X 統一教材｜英文播放＋中文翻譯｜不區分孩子</p><section><h2>選擇故事</h2><div id="books"></div><h2 id="title"></h2><p id="goal" class="muted"></p><button onclick="say('Hello! Let us read together.')">🔊 測試英文聲音</button><p id="status" role="status"></p></section><section class="tabs" id="tabs"></section><section id="content"></section><section><h2>📝 家長紀錄</h2><label>學習程度 <select id="level"><option>尚未開始</option><option>需要協助</option><option>練習中</option><option>能獨立完成</option></select></label><label>備註 <input id="memo" placeholder="今天的練習狀況" style="width:85%"></label><button class="primary" onclick="save()">儲存本冊紀錄</button><p id="saved" role="status"></p><small class="muted">紀錄儲存在此裝置，不會自動跨手機同步。請搭配正版紙本教材。</small></section></main><script>
const books={"2X":{"title":"Tom Cat and Jim Rat","zh":"湯姆貓與吉姆鼠","sound":"a / i","words":[["cat","貓"],["rat","老鼠"],["Tom","湯姆"],["Jim","吉姆"],["Dad","爸爸"],["Kim","金"],["lap","大腿上"],["bag","袋子"],["sip","小口喝"],["nip","輕咬"],["nap","小睡"],["tap","輕拍"],["him","他"],["his","他的"],["not","不"],["nips","輕咬"],["taps","輕拍"],["lets","讓"],["glad","高興"]],"lines":[["Dad has a bag.","爸爸有一個袋子。"],["Tom Cat is on Dad's lap.","湯姆貓在爸爸大腿上。"],["Jim Rat is on Kim's lap.","吉姆鼠在金的大腿上。"],["Dad taps Tom Cat.","爸爸輕拍湯姆貓。"]],"quiz":[["Who has a bag?","誰有袋子？","Dad.","爸爸。",["Dad.","Kim.","Jim Rat."]]]},"3X":{"title":"The Mud Hut","zh":"泥巴小屋","sound":"u","words":[["mud","泥巴"],["hut","小屋"],["bug","蟲"],["tug","拉"],["rug","地毯"],["sun","太陽"],["dig","挖"],["can","能"],["Mum","媽媽"],["Dad","爸爸"],["Meg","梅格"],["Sam","山姆"],["lot","許多"],["the","這個／那個"],["of","……的"],["lift","抬起"],["dump","倒出"],["snug","舒適的"]],"lines":[["Mum and Dad dig in the mud.","媽媽和爸爸在泥巴裡挖掘。"],["Meg and Sam can dig a lot of mud.","梅格和山姆能挖很多泥巴。"],["Is it a mud hut yet?","它已經是泥巴小屋了嗎？"],["It is a snug mud hut!","這是一間舒適的泥巴小屋！"]],"quiz":[["What are they making?","他們在做什麼？","A mud hut.","泥巴小屋。",["A mud hut.","A bag.","A car."]]]},"4X":{"title":"Ants at the Camp","zh":"營地裡的螞蟻","sound":"o（dot）","words":[["ant","螞蟻"],["ants","螞蟻們"],["bun","小圓麵包"],["frog","青蛙"],["pond","池塘"],["hot","熱的"],["cold","冷的"],["camp","營地"],["rug","地墊"],["egg","蛋"],["ham","火腿"],["nuts","堅果"],["seven","七"],["six","六"],["swim","游泳"],["back","回去"],["left","離開"],["milk","牛奶"],["dump","倒出"],["bump","碰撞"],["thin","瘦的"],["snug","舒適的"],["lift","抬起"],["log","原木"],["mud","泥巴"],["sit","坐"],["hop","跳"],["gets","得到／變得"]],"lines":[["Lin is at the camp.","Lin 在營地。"],["Max and Lin swim in the pond.","Max 和 Lin 在池塘游泳。"],["Lin has egg on a bun.","Lin 的麵包上有蛋。"],["Max gets ten gum nuts.","Max 拿到十顆桉樹果實。"],["The frog gets hot.","青蛙覺得熱了。"]],"quiz":[["Where do Max and Lin swim?","Max 和 Lin 在哪裡游泳？","In the pond.","在池塘。",["In the pond.","At home.","In a car."]],["What hops on the gum nuts?","什麼跳到果實上？","The frog.","青蛙。",["The frog.","A cat.","A dog."]]]}};
const $=x=>document.getElementById(x),modes=[["words","🔤 單字"],["read","📖 閱讀"],["listen","🎧 聽音選字"],["quiz","🧠 問答"],["record","🎙️ 錄音"]];let book=new URLSearchParams(location.search).get("book")||"2X",mode="words",i=0,score=0,total=0,rec,stream,audioUrl;if(!books[book])book="2X";
function node(tag,t){let e=document.createElement(tag);if(t!==undefined)e.textContent=t;return e}
function button(t,fn,active=false){let b=node("button",t);if(active)b.className="active";b.onclick=fn;return b}
function say(t,slow=false){if(!window.speechSynthesis){$("status").textContent="瀏覽器不支援語音";return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=slow?.65:.83;let v=speechSynthesis.getVoices();u.voice=v.find(x=>x.lang==="en-US")||v.find(x=>x.lang.startsWith("en"))||null;u.onerror=()=>$("status").textContent="播放失敗，請用 Safari 並檢查音量";speechSynthesis.speak(u)}
function pair(en,zh,parent){let d=node("div");d.className="pair";let a=node("span",en),b=node("span",zh);a.className="en";b.className="zh";d.append(a,b,button("🔊 英文",()=>say(en)),button("🐢 慢速",()=>say(en,true)));parent.append(d)}
function selectBook(k){book=k;i=score=total=0;history.replaceState(null,"","?book="+k);render()}
function selectMode(k){mode=k;i=0;render()}
function render(){let b=books[book],d=$("content");$("books").replaceChildren();Object.keys(books).forEach(k=>$("books").append(button(k+" "+books[k].zh,()=>selectBook(k),book===k)));$("title").textContent=book+"｜"+b.title;$("goal").textContent=b.zh+"｜發音重點："+b.sound;$("tabs").replaceChildren();modes.forEach(([k,t])=>$("tabs").append(button(t,()=>selectMode(k),mode===k)));d.replaceChildren();
if(mode==="words"){d.append(node("h2","單字＋中文翻譯"),node("p","點選英文朗讀或慢速發音。"));b.words.forEach(([en,zh])=>pair(en,zh,d))}
if(mode==="read"){d.append(node("h2","故事閱讀與中文翻譯"),node("p","以下是教學示範句，請搭配紙本第 2–11 頁；並非全文轉錄。"));b.lines.forEach(([en,zh],j)=>{let x=node("details"),s=node("summary","練習 "+(j+1));x.open=j===0;x.append(s);pair(en,zh,x);d.append(x)})}
if(mode==="listen"){let w=b.words[i%b.words.length],opts=[w];for(let j=1;opts.length<3&&j<b.words.length;j++){let x=b.words[(i+j*5)%b.words.length];if(!opts.some(y=>y[0]===x[0]))opts.push(x)}opts.sort((a,b)=>a[0].localeCompare(b[0]));d.append(node("h2","聽音選字"),button("🔊 播放題目",()=>say(w[0]),true));let choices=node("div"),feedback=node("p"),result=node("p","答對 "+score+" / "+total);choices.className="choices";opts.forEach(x=>choices.append(button(x[0],()=>{total++;if(x[0]===w[0])score++;feedback.textContent=x[0]===w[0]?"⭐ 答對！"+w[1]:"再試一次。中文提示："+w[1];result.textContent="答對 "+score+" / "+total})));d.append(choices,feedback,result,button("下一題 →",()=>{i++;render()}))}
if(mode==="quiz"){d.append(node("h2","故事理解"));b.quiz.forEach(([q,zh,a,azh,opts])=>{let x=node("details");x.append(node("summary",q),node("p",zh),button("🔊 聽問題",()=>say(q)));let result=node("p");opts.forEach(o=>x.append(button(o,()=>result.textContent=o===a?"⭐ 正確！"+azh:"再試一次")));x.append(result);d.append(x)})}
if(mode==="record"){let w=b.words[i%b.words.length];d.append(node("h2","跟讀錄音"));pair(w[0],w[1],d);let area=node("div");area.id="audio";d.append(button("🎙️ 開始錄音",startRecording,true),button("⏹ 停止",stopRecording),button("下一個 →",()=>{i++;render()}),area,node("p","錄音可回放，但尚未提供自動發音評分。請允許麥克風使用。"))}
let saved=JSON.parse(localStorage.getItem("lr-unified-"+book)||"{}");$("level").value=saved.level||"尚未開始";$("memo").value=saved.memo||""}
function save(){localStorage.setItem("lr-unified-"+book,JSON.stringify({level:$("level").value,memo:$("memo").value}));$("saved").textContent="已儲存 "+book+" 的紀錄"}
async function startRecording(){let area=$("audio");try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error("瀏覽器不支援錄音");stream=await navigator.mediaDevices.getUserMedia({audio:true});let chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType}));let a=node("audio");a.controls=true;a.src=audioUrl;if($("audio"))$("audio").replaceChildren(a);stream.getTracks().forEach(t=>t.stop())};rec.start();area.textContent="🔴 錄音中"}catch(e){area.textContent="無法錄音："+e.message}}
function stopRecording(){if(rec?.state==="recording")rec.stop()}render();
</script></html>
