<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Readers Games</title><style>body{font:18px -apple-system,sans-serif;background:#eef7f2;color:#183e30;margin:0}main{max-width:700px;margin:auto;padding:18px}section{background:white;border-radius:20px;padding:20px;margin:15px 0}button,select{font:inherit;border:1px solid #95b8a4;border-radius:12px;padding:12px;background:white;margin:5px}button:active,.active{background:#147b57;color:white}.primary{background:#147b57;color:white}h1{font-size:28px}.big{font-size:36px;font-weight:bold;text-align:center;padding:20px}#feedback{font-weight:bold}small{color:#647c6e}</style><main><h1>🎮 Little Readers 遊戲室</h1><p>爸爸媽媽陪玩 · 每次5–10分鐘</p><section><button id="ken" onclick="choose('Ken')">🐯 Ken</button><button id="louis" onclick="choose('Louis')">🦕 Louis</button><p><button onclick="game('listen')">🔊 聽音選字</button><button onclick="game('spell')">🔤 拼字</button><button onclick="game('speak')">🎙️ 跟讀錄音</button><button onclick="game('story')">📚 故事問答</button></p><p id="score"></p></section><section id="play"></section><section><h3>家長注意</h3><p>錄音僅供孩子與家長回放比較，這一版不會自動評估發音準確率，也不會把錄音上傳伺服器。iPhone 請使用 Safari 並允許麥克風。</p><p><a href="./">← 返回家長教案</a></p></section></main><script>
const sets={Ken:[['cat','🐈'],['bag','🎒'],['sip','🥤'],['sun','☀️'],['pig','🐖']],Louis:[['mud','🟤'],['hut','🏠'],['bug','🐛'],['dig','⛏️'],['sun','☀️']]};const stories={Ken:[['Who has a bag?','Dad',['Dad','Jim Rat','Tom Cat']],['Who has a sip?','Jim Rat',['Kim','Dad','Jim Rat']]],Louis:[['Who can dig?','Dad',['Dad','Tom Cat','Jim Rat']],['What are they building?','A mud hut',['A mud hut','A bag','A car']]]};let kid='Ken',mode='listen',index=0,correct=0,total=0,stream,rec,chunks=[],audioURL;const el=id=>document.getElementById(id);function say(s){if(!('speechSynthesis'in window)){alert('請使用 Safari 開啟網站');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}function choose(k){kid=k;index=0;correct=0;total=0;render()}function game(m){mode=m;index=0;correct=0;total=0;render()}function shuffle(a){return a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1])}function answer(good){total++;if(good)correct++;el('feedback').textContent=good?'⭐ 答對了！':'再試一次！可以先聽聲音。';el('score').textContent='本次答對 '+correct+' / '+total+' 題';if(good)setTimeout(()=>{index++;render()},900)}function render(){el('ken').className=kid==='Ken'?'active':'';el('louis').className=kid==='Louis'?'active':'';let arr=sets[kid],w=arr[index%arr.length][0],html='';if(mode==='listen'){let opts=shuffle([w,...shuffle(arr.filter(x=>x[0]!==w)).slice(0,2).map(x=>x[0])]);html='<h2>聽聲音選單字</h2><button class="primary" onclick="say(\''+w+'\')">🔊 播放單字</button><p>'+opts.map(x=>'<button onclick="answer('+String(x===w)+')">'+arr.find(y=>y[0]===x)[1]+' '+x+'</button>').join('')+'</p>'}else if(mode==='spell'){let letters=shuffle(w.split(''));html='<h2>聽音拼字</h2><button class="primary" onclick="say(\''+w+'\')">🔊 播放</button><p>依序點字母：</p><div class="big" id="typed">_</div>'+letters.map((x,i)=>'<button id="letter'+i+'" onclick="typeLetter('+i+',\''+x+'\',\''+w+'\')">'+x.toUpperCase()+'</button>').join('')+'<p><button onclick="render()">重試</button></p>'}else if(mode==='speak'){html='<h2>小小配音員</h2><div class="big">'+w+'</div><button onclick="say(\''+w+'\')">🔊 聽標準發音</button><p><button class="primary" onclick="startRecording()">🎙️ 開始錄音</button><button onclick="stopRecording()">⏹️ 停止錄音</button></p><div id="recording"></div><p><button onclick="index++;render()">下一個單字 →</button></p><small>這裡沒有AI發音分數。家長可以比較首音、中間母音與尾音。</small>'}else{let q=stories[kid][index%stories[kid].length];html='<h2>故事理解</h2><p>請先讀紙本故事。</p><h3>'+q[0]+'</h3><button onclick="say(\''+q[0]+'\')">🔊 聽問題</button><p>'+shuffle(q[2]).map(x=>'<button onclick="answer('+String(x===q[1])+')">'+x+'</button>').join('')+'</p>'}el('play').innerHTML=html+'<p id="feedback"></p>';el('score').textContent='本次答對 '+correct+' / '+total+' 題'}let typed='';function typeLetter(i,x,w){typed+=x;el('letter'+i).disabled=true;el('typed').textContent=typed.toUpperCase();if(typed.length===w.length){let ok=typed===w;typed='';answer(ok);if(!ok)setTimeout(render,900)}}async function startRecording(){try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('此瀏覽器不支援錄音');stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{let blob=new Blob(chunks,{type:rec.mimeType});if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(blob);el('recording').innerHTML='<audio controls src="'+audioURL+'"></audio><p>家長聽完後，請孩子再試一次。</p>';stream.getTracks().forEach(t=>t.stop())};rec.start();el('recording').textContent='🔴 錄音中…'}catch(e){el('recording').textContent='無法錄音：'+e.message+'。請在 Safari 中開啟 HTTPS 網站並允許麥克風。'}}function stopRecording(){if(rec?.state==='recording')rec.stop()}render();
</script></html>
