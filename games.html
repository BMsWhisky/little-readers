<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Readers Games v2</title><style>body{font:17px -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#edf6f0;color:#173e2d;margin:0}main{max-width:730px;margin:auto;padding:17px}section{background:white;border-radius:18px;padding:17px;margin:13px 0}button,select{font:inherit;padding:11px;border:1px solid #a6c6b3;border-radius:12px;background:white;color:#184531;margin:4px}button.active,.primary{background:#147a53;color:white}button:disabled{opacity:.4}h1{font-size:27px}h2{font-size:21px}.big{font-size:38px;text-align:center;font-weight:bold;margin:20px}.muted,small{color:#617a69}.choice{min-width:95px;min-height:64px}.good{color:#08753b}.bad{color:#b24a24}a{color:#147a53}</style><main><p><a href="story4x.html" style="display:inline-block;padding:12px;background:#e0f3e4;border-radius:12px;color:#126e48;font-weight:bold">🐸 新增 4X｜Ants at the Camp（英文朗讀＋中文翻譯＋遊戲） →</a></p><h1>🎮 Little Readers Games v2.0</h1><p class="muted">整本教材練習 · 爸爸媽媽陪玩 · 非僅老師評語</p><p><a href="./">🏠 首頁</a>　<a href="curriculum.html">📚 完整教案</a></p><section><button id="ken" onclick="choose('Ken')">🐯 楷泳 Ken</button><button id="louis" onclick="choose('Louis')">🦕 沐霖 Louis</button><p><label>學習範圍 <select id="scope" onchange="reset()"><option value="all">全冊核心單字</option><option value="phonics">自然發音</option><option value="special">特殊／較長單字</option></select></label></p><div id="modes"></div><p id="score"></p></section><section id="play"></section><section><h2>📊 本機學習紀錄</h2><div id="history"></div><button onclick="copyHistory()">複製成績給另一位家長</button><p class="muted">答題紀錄儲存在目前瀏覽器，不會同步到其他手機。錄音只在目前頁面回放，不會上傳。</p></section></main><script>
const bank={
Ken:{all:["Tom","Cat","Jim","Rat","Dad","Kim","lap","bag","sip","nip","nap","tap","him","his","not","nips","taps","lets","glad"],phonics:["cat","bag","lap","Jim","Kim","sip","nip","nap","tap"],special:["A","a","nips","taps","lets","glad"],spelling:["cat","bag","lap","Jim","Kim","sip","nip","nap","tap","nips","taps","lets","glad"],q:[["Who is on Dad's lap?","Tom Cat",["Tom Cat","Jim Rat","Kim"]],["Who has a bag?","Dad",["Dad","Tom Cat","Kim"]],["Who has a sip?","Jim Rat",["Jim Rat","Dad","Tom Cat"]],["Who is on Kim's lap?","Jim Rat",["Jim Rat","Tom Cat","Dad"]],["What does Dad do to Tom Cat?","He taps Tom Cat.",["He taps Tom Cat.","He digs mud.","He has a nap."]]]},
Louis:{all:["mud","hut","bug","tug","rug","sun","dig","can","Mum","Dad","Meg","Sam","lot","the","of","lift","dump","snug"],phonics:["mud","hut","bug","tug","rug","sun"],special:["the","of","lift","dump","snug"],spelling:["mud","hut","bug","tug","rug","sun","dig","lift","dump","snug"],q:[["What are they making?","A mud hut",["A mud hut","A bag","A car"]],["What does dig mean?","To make a hole",["To make a hole","To sleep","To drink"]],["What does lift mean?","To raise something",["To raise something","To sleep","To run"]],["What does dump mean?","To drop something in a pile",["To drop something in a pile","To drink","To read"]],["What is a hut?","A small house",["A small house","A bag","A toy"]]]}};
let kid="Ken",mode="listen",index=0,score=0,total=0,typed="",recording=null,stream=null,recordUrl=null;const $=id=>document.getElementById(id);
const modes=[["listen","🔊 聽音選字"],["spell","🔤 字母拼字"],["meaning","🧠 故事問答"],["speak","🎙️ 跟讀錄音"]];
function list(){let b=bank[kid],s=$("scope").value;return (mode==="spell"?b.spelling.filter(x=>s==="all"||b[s].includes(x)):b[s])}
function shuffle(a){return a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1])}
function say(t){if(!("speechSynthesis"in window)){alert("請用 Safari 開啟網站");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.8;speechSynthesis.speak(u)}
function choose(k){kid=k;reset()}function changeMode(m){mode=m;reset()}function reset(){index=0;score=0;total=0;typed="";render()}
function answer(ok){total++;if(ok)score++;const f=$("feedback");f.textContent=ok?"⭐ 答對了！":"再試一次，先聽聲音。";f.className=ok?"good":"bad";saveScore();$("score").textContent="本次 "+score+" / "+total+" 題";if(ok)setTimeout(()=>{index++;typed="";render()},850)}
function saveScore(){let key="lr-game-"+kid;let h=JSON.parse(localStorage.getItem(key)||"{}");h[mode+"-"+$("scope").value]={correct:score,total,updated:new Date().toLocaleDateString("zh-TW")};localStorage.setItem(key,JSON.stringify(h));showHistory()}
function showHistory(){const h=JSON.parse(localStorage.getItem("lr-game-"+kid)||"{}");$("history").innerHTML=Object.entries(h).map(([k,v])=>"<p>"+k+"："+v.correct+"/"+v.total+"（"+v.updated+"）</p>").join("")||"尚無答題紀錄"}
function render(){let b=bank[kid],arr=list(),w=arr[index%arr.length]||b.all[0];$("ken").className=kid==="Ken"?"active":"";$("louis").className=kid==="Louis"?"active":"";$("modes").replaceChildren();modes.forEach(([m,label])=>{const btn=document.createElement("button");btn.textContent=label;btn.className=m===mode?"active":"";btn.onclick=()=>changeMode(m);$("modes").append(btn)});$("score").textContent="本次 "+score+" / "+total+" 題";let html="";
if(mode==="listen"){const options=shuffle([w,...shuffle(arr.filter(x=>x!==w)).slice(0,Math.min(2,arr.length-1))]);html='<h2>聽音選字</h2><p>按播放，再選出你聽到的單字。</p><button class="primary" id="listen">🔊 播放單字</button><div id="choices"></div>';$("play").innerHTML=html;const b1=$("listen");b1.onclick=()=>say(w);options.forEach(x=>choice(x,()=>answer(x===w)))}
else if(mode==="spell"){html='<h2>字母拼字</h2><button class="primary" id="listen">🔊 播放單字</button><div class="big" id="typed">_</div><div id="choices"></div><button id="retry">重新排列</button>';$("play").innerHTML=html;$("listen").onclick=()=>say(w);shuffle(w.toLowerCase().split("")).forEach((x,i)=>choice(x.toUpperCase(),()=>{typed+=x;$("typed").textContent=typed.toUpperCase();$("choices").children[i].disabled=true;if(typed.length===w.length){let ok=typed===w.toLowerCase();answer(ok);if(!ok)setTimeout(()=>{typed="";render()},700)}}));$("retry").onclick=()=>{typed="";render()}}
else if(mode==="meaning"){const q=b.q[index%b.q.length];$("play").innerHTML='<h2>故事理解</h2><p>先閱讀紙本故事，再聽問題。</p><h3 id="question"></h3><button id="listen" class="primary">🔊 聽問題</button><div id="choices"></div>';$("question").textContent=q[0];$("listen").onclick=()=>say(q[0]);shuffle(q[2]).forEach(x=>choice(x,()=>answer(x===q[1])))}
else{$("play").innerHTML='<h2>小小配音員</h2><div class="big" id="target"></div><button id="listen">🔊 聽標準發音</button><p><button class="primary" id="record">🎙️ 開始錄音</button><button id="stop">⏹️ 停止錄音</button></p><div id="audio"></div><button id="next">下一個單字 →</button><p class="muted">目前只支援錄音回放，不會假裝已分析發音，也不提供虛構分數。</p>';$("target").textContent=w;$("listen").onclick=()=>say(w);$("record").onclick=startRecording;$("stop").onclick=stopRecording;$("next").onclick=()=>{index++;render()}}
const f=document.createElement("p");f.id="feedback";f.setAttribute("role","status");$("play").append(f);showHistory()}
function choice(label,cb){const btn=document.createElement("button");btn.className="choice";btn.textContent=label;btn.onclick=cb;$("choices").append(btn)}
async function startRecording(){try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error("瀏覽器不支援錄音");stream=await navigator.mediaDevices.getUserMedia({audio:true});let chunks=[];recording=new MediaRecorder(stream);recording.ondataavailable=e=>chunks.push(e.data);recording.onstop=()=>{if(recordUrl)URL.revokeObjectURL(recordUrl);recordUrl=URL.createObjectURL(new Blob(chunks,{type:recording.mimeType}));const audio=document.createElement("audio");audio.controls=true;audio.src=recordUrl;$("audio").replaceChildren(audio);stream.getTracks().forEach(t=>t.stop())};recording.start();$("audio").textContent="🔴 錄音中…"}catch(e){$("audio").textContent="無法錄音："+e.message+"。請使用 Safari、允許麥克風。"}}
function stopRecording(){if(recording?.state==="recording")recording.stop()}
async function copyHistory(){let h=JSON.parse(localStorage.getItem("lr-game-"+kid)||"{}"),txt=kid+" 全冊遊戲紀錄\n"+Object.entries(h).map(([k,v])=>k+"："+v.correct+"/"+v.total).join("\n");try{await navigator.clipboard.writeText(txt);alert("已複製")}catch(e){prompt("請複製",txt)}}render();
</script></html>
